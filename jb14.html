<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>nobehong jailbreak LEAK32</title>
    <style>
      :root {
        --bg: #0a0a08;
        --panel: #0f0e0a;
        --sunk: #0b0a07;
        --line: #3d3520;
        --fg: #d4c9a8;
        --bright: #f0e6c8;
        --dim: #9a8d6e;
        --faint: #5c5340;
        --ok: #d4a017;
        --bad: #c45c4a;
        --warn: #d4a017;
        --gold: #d4a017;
        --gold-light: #f0c850;
        --gold-dark: #8a6a10;
        --sans: "Segoe UI", system-ui, sans-serif;
        --mono: Consolas, "DejaVu Sans Mono", monospace;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; min-height: 100%;
        background: var(--bg); color: var(--fg);
        font: 15px/1.45 var(--sans);
      }
      #brand {
        padding: 10px 14px;
        border-bottom: 1px solid var(--line);
        background: rgba(10, 10, 8, 0.92);
        text-align: center;
      }
      #brand b {
        color: var(--gold-light); font-size: 16px; font-weight: 700;
        letter-spacing: 0.18em; text-transform: uppercase;
      }
      #ramBox {
        overflow: hidden; padding: 5px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--sunk); color: var(--gold);
        font: 11px/1.4 var(--mono);
        text-overflow: ellipsis; white-space: nowrap;
      }
      #spin {
        position: fixed; top: calc(50% + 20px); left: 50%;
        width: 46px; height: 46px; margin: -23px 0 0 -23px;
        border: 4px solid var(--line); border-top-color: var(--gold);
        border-radius: 50%; animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #msg {
        position: fixed; top: 50%; left: 0; right: 0;
        transform: translateY(-50%); display: none;
        text-align: center; font-size: 16px; letter-spacing: 0.5px;
      }
      #state, #out { display: none; }
      body.done #spin, body.fail #spin { display: none; }
      body.fail #msg { display: block; }
      body.done #msg {
        display: block; color: var(--gold-light);
        font-weight: 700; letter-spacing: 2px;
      }
      body.log {
        display: flex; flex-direction: column; height: 100vh;
      }
      body.log #spin, body.log #msg { display: none; }
      body.log #wrap {
        display: flex; flex-direction: column; flex: 1;
        min-height: 0; padding: 14px 18px 30px;
      }
      body.log #state {
        display: block; margin: 0 0 8px;
        font-size: 22px; font-weight: 700; color: var(--gold-light);
      }
      body.log #out {
        display: block; flex: 1; min-height: 0; overflow-y: auto;
        padding: 10px 12px; border: 1px solid var(--line);
        border-radius: 5px; background: var(--sunk);
        font: 12px/1.45 var(--mono); white-space: pre-wrap;
      }
      .notice {
        margin: 1em 0; padding: 0.7em 1em;
        border: 2px solid var(--bad); background: #2a1414;
        color: #f99; font: 700 20px/1.4 var(--sans);
      }
      .ok { color: var(--gold-light); }
      .bad { color: var(--bad); }
      .warn { color: var(--warn); }
      code { color: var(--gold); }
    </style>
  </head>
  <body>
    <div id="brand"><b>NOBEHONG JAILBREAK</b> <span style="color:#5c5340;font:11px monospace">LEAK32</span></div>
    <div id="ramBox">RAM: checking...</div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=leak32";
    </script>
  </body>
</html>
